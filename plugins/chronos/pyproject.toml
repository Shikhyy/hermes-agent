[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-chronos"
version = "1.0.0"
description = "Speculative branching for Hermes Agent: isolated git-worktree rollouts, test-based scoring and safe merging."
readme = "README.md"
authors = [{ name = "Shikhyy" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["hermes-agent", "speculative-execution", "reasoning", "git-worktree", "rollback"]

[project.urls]
Homepage = "https://github.com/Shikhyy/hermes-agent/tree/main/plugins/chronos"
Documentation = "https://github.com/Shikhyy/hermes-agent/blob/main/plugins/chronos/README.md"
Repository = "https://github.com/Shikhyy/hermes-agent"

[project.scripts]
chronos = "chronos.cli:main"
