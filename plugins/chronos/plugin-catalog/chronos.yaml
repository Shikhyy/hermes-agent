name: chronos
version: "1.0.0"
description: "Speculative Tree-Search Reasoning, Ephemeral Worktree Rollouts & Rewind Engine for Hermes Agent. Explores multiple solution trajectories in isolated workspaces, verifies against test suites, and visualizes the decision DAG in Hermes Desktop."
repo: "https://github.com/NousResearch/hermes-chronos"
sha: "HEAD"
tier: "community"
tags:
  - reasoning
  - developer-tools
  - memory
  - execution
  - desktop
requires_hermes: ">=0.4.0"
provides_tools:
  - chronos_branch
  - chronos_evaluate
  - chronos_merge
  - chronos_rewind
  - chronos_status
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
desktop_entry: "desktop/plugin.js"
