name: chronos
version: "1.0.0"
description: "Speculative branching for Hermes Agent: try several candidate fixes in isolated git worktrees, verify each against the project's tests, and merge only a verified winner."
author: "Shikhyy"
license: "MIT"
homepage: "https://github.com/Shikhyy/hermes-agent/tree/main/plugins/chronos"
repository: "https://github.com/Shikhyy/hermes-agent"
requires_hermes: ">=0.4.0"

provides_tools:
  - chronos_branch
  - chronos_evaluate
  - chronos_merge
  - chronos_rewind
  - chronos_status

provides_hooks:
  - on_session_start
  - on_session_finalize

config_schema:
  max_branches:
    type: int
    default: 3
    description: "Maximum number of speculative branches explored per chronos_branch call (1-8)."
  verifier_command:
    type: str
    default: "auto"
    description: "Command used to verify branches, e.g. 'pytest -q' or 'npm test'. Parsed into an argv list and run through Hermes' terminal tool; the model cannot override it. 'auto' detects the project's test runner."
  timeout_seconds:
    type: int
    default: 60
    description: "Maximum run time of the verification command per branch (1-600)."
